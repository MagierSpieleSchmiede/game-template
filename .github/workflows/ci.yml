name: CI

# The gates from AGENTS.md on every platform:
#   tier 1  Linux, Windows, macOS   fmt, clippy, test
#   tier 2  Android, iOS            cargo check of the simulation
#   tier 3  Web (wasm32)            cargo check of the simulation, cargo build of the client
#   msrv    Linux                   cargo check of everything with the declared rust-version
# Changes that only touch the vault or the site are left to deploy.yml.
# main is built on push too: two pull requests that pass on their own can still break each
# other once both are merged.

on:
  push:
    branches: ["main", "dev-*"]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and tests on the three desktop systems.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The client's Bevy (audio, input, windowing) links these on Linux.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The workspace must build with the oldest Rust it claims to support (rust-version in
  # Cargo.toml); the other jobs use the newest stable. Keep the toolchain below in step with
  # rust-version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked

  # The simulation must build for every platform (docs/architecture/platforms.md).
  # iOS runs on macOS because a build script of bevy_log's iOS backend compiles C with the
  # Apple toolchain. Android needs the android-check feature, see crates/game_sim/Cargo.toml.
  sim-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            features: ""
          - target: aarch64-linux-android
            os: ubuntu-latest
            features: "--features android-check"
          - target: aarch64-apple-ios
            os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check -p game_sim --locked --target ${{ matrix.target }} ${{ matrix.features }}

  # The client must stay buildable for the web. A full build, not a check: only linking finds
  # a dependency that has no wasm32 implementation of something it imports. Nothing is run or
  # packaged here (no wasm-bindgen, no page); see docs/architecture/platforms.md.
  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-client
      - run: cargo build -p game_client --locked --target wasm32-unknown-unknown
