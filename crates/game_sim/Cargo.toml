[package]
name = "game_sim"
description = "The deterministic, headless tick simulation of the game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# No windowing, rendering, audio or threads: the simulation must run headless and build
# for wasm32 (ADR-0005, ADR-0009). Avian without `parallel` (threads) and without
# `debug-plugin` (rendering); only what static colliders and spatial queries need.
avian3d = { workspace = true, features = ["3d", "parry-f32"] }
bevy = { workspace = true, features = ["std"] }
serde = { workspace = true }
postcard = { workspace = true }

# Bevy always links android-activity on Android, which only compiles once the app picks
# an implementation; the client does that through bevy_winit, which the simulation must
# not use. This feature picks one so that CI can `cargo check` game_sim for Android on
# its own. The client never enables it.
[features]
android-check = ["dep:android-activity", "android-activity/native-activity"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", optional = true }
